version: 2
updates:
  # GitHub Actions の固定 SHA とバージョンコメントを PR で更新し、依存先の変更をレビュー可能にします。
  # Package.swift に外部依存がないため、Swift/SwiftPM の更新設定は不要です。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
