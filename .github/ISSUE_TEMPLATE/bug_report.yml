name: 不具合報告 / Bug report
description: ScopedAnimation の想定と異なる挙動を報告 / Report incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ScopedAnimation はアニメーションの**遮断と検出**を提供します。
        状態変更は、その状態を読むすべてのビューに届きます。報告前に README の契約を確認してください。
        日本語・英語のどちらでも報告できます。Reports in English are welcome; see [README in English](https://github.com/9uiLe/swift-scoped-animation/blob/master/README.en.md).
  - type: textarea
    id: what-happened
    attributes:
      label: 実際の挙動と期待する挙動 / Actual and expected behavior
      description: 何をしたときに、何が起きたかを記載してください。
      placeholder: AnimationScope で囲んだとき、期待した結果は…、実際には…
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順 / Steps to reproduce
      description: 最小の手順、または単独で再現できる SwiftUI コードを記載してください。
      placeholder: |
        1. ...
        2. ...
      render: swift
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ScopedAnimation のバージョン / Version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: プラットフォーム / Platform
      description: 発生した環境をすべて選んでください。
      multiple: true
      options:
        - iOS
        - macOS
        - tvOS
        - watchOS
        - visionOS
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Xcode / Swift のバージョン / Toolchain version
      placeholder: "Xcode 26.5 / Swift 6.3.2"
    validations:
      required: true
  - type: dropdown
    id: build-config
    attributes:
      label: ビルド構成 / Build configuration
      options:
        - DEBUG
        - RELEASE
        - 両方 / Both
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 診断出力（任意）/ Diagnostics (optional)
      description: 関連する DEBUG 警告、コンソール出力、スタックトレースを原文のまま貼ってください。
      render: shell
